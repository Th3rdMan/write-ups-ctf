name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout write-ups
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git quartz

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Prepare Quartz content
        shell: bash
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.DS_Store' repo/ quartz/content/

          find quartz/content -name README.md -print0 | while IFS= read -r -d '' file; do
            target="$(dirname "$file")/index.md"
            if [ ! -f "$target" ]; then
              cp "$file" "$target"
            fi
          done

          find quartz/content -name README.md -delete

      - name: Configure Quartz
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg = Path('quartz/quartz.config.ts')
          text = cfg.read_text(encoding='utf-8')
          text = text.replace('pageTitle: "Quartz 4"', 'pageTitle: "Th3rD — Write-ups CTF"')
          text = text.replace('locale: "en-US"', 'locale: "fr-FR"')
          text = text.replace('baseUrl: "quartz.jzhao.xyz"', 'baseUrl: "Th3rdMan.github.io/write-ups-ctf"')
          cfg.write_text(text, encoding='utf-8')
          PY

      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build

      - name: Disable Jekyll
        run: touch quartz/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
